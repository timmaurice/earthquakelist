blueprint:
  name: Earthquake List - Notify on New Earthquake
  description: >-
    Sends a notification whenever a new matching earthquake is reported by an
    Earthquake List sensor. Triggers on the sensor's `time` attribute rather
    than its state, so it still fires when consecutive earthquakes share the
    same magnitude. Optionally require a higher minimum magnitude than the
    sensor itself is configured for, or restrict to tsunami/impact alerts only.
  domain: automation
  source_url: https://github.com/timmaurice/earthquakelist/blob/main/blueprints/automation/timmaurice/earthquake_notify.yaml
  input:
    earthquake_sensor:
      name: Earthquake Sensor
      description: The Earthquake List "Latest Earthquake" sensor to watch.
      selector:
        entity:
          filter:
            integration: earthquakelist
            domain: sensor
    min_magnitude:
      name: Minimum Magnitude
      description: >-
        Only notify for earthquakes at or above this magnitude. Leave at 0 to
        notify for every new match (the sensor's own configured filter still
        applies).
      default: 0
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: box
    tsunami_only:
      name: Tsunami/Alert Only
      description: >-
        Only notify when the earthquake carries a tsunami flag or a yellow,
        orange or red USGS impact level.
      default: false
      selector:
        boolean:
    notify_action:
      name: Notification Action
      description: >-
        The action(s) to run to send the notification. Use the `title` and
        `message` variables provided by this blueprint in your notify action's
        data, e.g. `title: "{{ title }}"` / `message: "{{ message }}"`.
      selector:
        action:

mode: queued
max_exceeded: silent

variables:
  min_magnitude: !input min_magnitude
  tsunami_only: !input tsunami_only
  # The variables render before the conditions, and the trigger also fires when
  # the sensor goes unavailable (the `time` attribute disappears), so every
  # lookup must survive a missing attribute (or a missing to_state).
  place: >-
    {{ (trigger.to_state.attributes.get('place') or trigger.to_state.attributes.get('location')
    or trigger.to_state.name) if trigger is defined and trigger.to_state is not none else none }}
  magnitude: '{{ trigger.to_state.state if trigger is defined and trigger.to_state is not none else none }}'
  distance: >-
    {{ trigger.to_state.attributes.get('distance_km')
    if trigger is defined and trigger.to_state is not none else none }}
  direction: >-
    {{ trigger.to_state.attributes.get('direction')
    if trigger is defined and trigger.to_state is not none else none }}
  # alert_level is absent for most quakes and "green" (no significant impact)
  # for many others, so only the higher USGS impact levels count as an alert.
  is_tsunami: >-
    {{ trigger is defined and trigger.to_state is not none and (
    trigger.to_state.attributes.alert_tsunami | default(false) | bool(false)
    or (trigger.to_state.attributes.alert_level | default('', true) | string | lower)
    in ['yellow', 'orange', 'red']) }}
  title: "{{ 'Tsunami Alert' if is_tsunami else 'New Earthquake' }} - M{{ magnitude }} near {{ place }}"
  message: >-
    {{ 'Magnitude ' ~ magnitude ~ ' earthquake near ' ~ place
    ~ (' (' ~ distance | float(0) | round(0) | int ~ ' km ' ~ direction | default('', true) ~ ')'
    if distance is number or (distance is string and distance | float(none) is not none) else '') ~ '.' }}

trigger:
  - trigger: state
    entity_id: !input earthquake_sensor
    attribute: time

condition:
  - condition: template
    # Both states must carry a time: while the sensor is unavailable the
    # attribute is gone, so the same quake would look new on recovery.
    value_template: >-
      {{ trigger.from_state is not none and trigger.to_state is not none
      and trigger.from_state.attributes.get('time') is not none
      and trigger.to_state.attributes.get('time') is not none
      and trigger.to_state.attributes.time != trigger.from_state.attributes.time }}
  - condition: template
    value_template: '{{ trigger.to_state.state | float(0) >= min_magnitude }}'
  - condition: template
    value_template: '{{ not tsunami_only or is_tsunami }}'

action: !input notify_action

name: Canary

# The unit tests run on answers of api.earthquakelist.org as they were recorded
# (tests/fixtures), so they stay green when the API changes - and it is an
# undocumented one, reverse engineered from the site's own scripts. This job
# sends the integration's own requests once a week, reads the answers with its
# own client and parser, and fails when they find nothing, when a field the
# fixtures have is gone or when a value no longer has the shape the parser
# expects. See scripts/canary.py; when it fails because the format moved, fix
# the parser and run scripts/refresh_fixtures.py.

on:
  schedule:
    - cron: '41 6 * * 1' # Mondays, off the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canary:
    name: Live API canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Same interpreter as the tests: the client is imported from the
          # integration, and with it Home Assistant.
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run the integration against the live API
        run: |
          set +e
          PYTHONPATH=. python scripts/canary.py 2>&1 | tee canary_output.txt
          code=${PIPESTATUS[0]}
          set -e

          {
            echo "### Live API canary"
            if [ "$code" -eq 0 ]; then
              echo "> [!NOTE]"
              echo "> The integration still reads the live API."
            elif [ "$code" -eq 1 ]; then
              echo "> [!CAUTION]"
              echo "> **The API's format has most likely changed.** Fix the parser, then run \`python scripts/refresh_fixtures.py\`."
            else
              echo "> [!WARNING]"
              echo "> The API could not be reached, so nothing is known about its format."
            fi
            echo ""
            echo '```'
            cat canary_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$code"

name: Tests

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

env:
  # The oldest core this job is willing to call a valid run. hacs.json declares
  # no minimum, so this tracks the current core rather than a support floor - it
  # is a tripwire. See the "Report and check the resolved core" step.
  MINIMUM_CORE: '2026.9.3'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Home Assistant dropped Python 3.12 after 2025.1.4; 2025.2.0+ need
          # >=3.13 and 2026.3.0+ need >=3.14.2. On 3.12 pip could still satisfy
          # requirements-test.txt - by backtracking all the way to core 2025.1.4
          # - so the suite was green against a core no user runs.
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Report and check the resolved core
        run: |
          # requirements-test.txt pins nothing, and
          # pytest-homeassistant-custom-component pins an *exact* homeassistant.
          # So the core under test is chosen by the resolver, not by this repo,
          # and it can move without a commit. Print it so every run says which
          # core it tested, and fail if the resolver has quietly walked backwards
          # to an older one instead of erroring out.
          python - <<'PY'
          import os
          import sys
          from importlib.metadata import requires, version

          from packaging.requirements import Requirement
          from packaging.version import Version

          core = version("homeassistant")
          phcc = version("pytest-homeassistant-custom-component")
          floor = os.environ["MINIMUM_CORE"]

          print(f"python                                = {sys.version.split()[0]}")
          print(f"homeassistant                         = {core}")
          print(f"pytest-homeassistant-custom-component = {phcc}")
          print(f"minimum core this job accepts         = {floor}")

          failures = []

          if Version(core) < Version(floor):
              failures.append(
                  f"homeassistant {core} is older than the required {floor}. The "
                  "resolver backtracked instead of failing - usually because the "
                  "interpreter is too old for the current core, which makes an "
                  "unsatisfiable pin look like a satisfiable older one."
              )

          # The exact pin is the mechanism behind that backtracking, so name it
          # rather than leaving a mismatch to be puzzled out from two versions.
          pinned = [
              Requirement(r)
              for r in (requires("pytest-homeassistant-custom-component") or [])
              if Requirement(r).name == "homeassistant"
          ]
          for requirement in pinned:
              if not requirement.specifier.contains(core, prereleases=True):
                  failures.append(
                      f"pytest-homeassistant-custom-component {phcc} pins "
                      f"homeassistant{requirement.specifier}, but {core} is installed."
                  )

          if failures:
              print()
              for failure in failures:
                  print(f"error: {failure}")
              raise SystemExit(1)

          print("\nok: testing against the current core.")
          PY

      - name: Run tests (offline)
        run: |
          # Run the full test suite offline. Network calls are blocked by pytest-socket
          PYTHONPATH=. pytest custom_components/earthquakelist/tests

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run check-format

      - name: Run tests
        run: npm test

      - name: Build card
        run: npm run build

  # No e2e job on purpose. The Playwright suite (npm run test:e2e) drives a real Home
  # Assistant in Docker and signs in as an existing admin, but `config/` is gitignored,
  # so a fresh checkout has no onboarded instance for it to sign in to. Wiring it up
  # means automating onboarding (create the admin, pick a country, skip analytics)
  # before global-setup runs - worth doing, but its own change, not a test tweak.
  # Until then test/e2e/* only ever runs locally: treat a green CI as covering the
  # unit suites only.
